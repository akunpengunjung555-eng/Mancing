name = "mancing"
main = "worker.js"
compatibility_date = "2026-10-13"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/ws", "/health", "/api/*"]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[d1_databases]]
binding = "DB"
database_name = "mancing-db"
database_id = "ff13c36f-3d5c-494c-9552-2bb68c8b91b9"

[vars]
ALLOW_REGISTER = "1"
START_COINS = "1000000000"
MAX_GAIN_PER_MIN = "2000000000000"
CONNECTOR_URL = ""
